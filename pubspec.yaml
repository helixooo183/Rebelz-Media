name: sohbet
description: "Rebelz Media — Firebase destekli, açık/koyu temalı sohbet ve kanal uygulaması."
publish_to: 'none'
version: 0.4.0+16

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cloud_firestore: ^6.0.1
  firebase_auth: ^6.0.1
  firebase_core: ^4.1.0
  go_router: ^16.0.0
  intl: ^0.20.2
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2
  record: ^6.0.0
  audioplayers: ^6.0.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
