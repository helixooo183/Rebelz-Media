name: APK derle

# Bu workflow, APK'yı GitHub'ın makinelerinde üretir (yerel Android SDK
# kurulumu gerekmez). Actions sekmesinden "Run workflow" ile çalıştırın,
# bitince APK'yı artifact olarak indirin.

on:
  workflow_dispatch:
  push:
    # 'arena/**' = Arena ajan dallari; PR birlesmeden once derlemeyi dogrulamak icin.
    branches: [main, master, 'arena/**']
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Firebase konsolunda kayitli upload (release) parmak izi.
      # Docs/README ile ayni deger; degisirse tek yerden guncellenir.
      EXPECTED_UPLOAD_SHA1: '2E:96:3D:A6:63:06:D1:8F:34:A8:E5:1A:BD:7C:24:F1:41:B8:6E:8D'
      # anahtarlar/upload-keystore.p12 ile ayni olmali (secret doğrulama)
      EXPECTED_KEYSTORE_BYTES: '4384'
      EXPECTED_KEYSTORE_SHA256: '0937d02a12134a77afe4cbf2e63b37cc6ee5bc2d5ae3c9aaef7842bfd4796bef'

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.35.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      # Gradle bağımlılıkları ve wrapper dağıtımı ikinci koşuda yeniden
      # indirilmesin (ilk koşuda birkaç dakika kazandırır).
      - name: Gradle önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Ortam bilgisi
        run: |
          free -m
          nproc
          java -version

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Analiz + testler
        run: |
          flutter analyze
          flutter test

      # GitHub -> Settings -> Secrets and variables -> Actions altinda
      # KEYSTORE_B64 (base64'lenmis .p12), KEYSTORE_PASS, KEY_ALIAS, KEY_PASS
      # tanimliysa upload anahtari acilir ve release APK onunla imzalanir.
      # Tanimli degilse build.gradle.kts debug anahtarina duser.
      - name: Release imza anahtarını aç (secret varsa)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set -o pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::KEYSTORE_B64 tanımlı değil — release APK debug keystore ile imzalanacak."
            exit 0
          fi

          # Kopyala-yapıştır kaynaklı boşluk/satır sonlarını temizle (değerler
          # yalnızca alfanümerik/bas64; boşluk hiçbir zaman anlamlı değil).
          B64=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')
          PASS=$(printf '%s' "$KEYSTORE_PASS" | tr -d '[:space:]')
          ALIAS=$(printf '%s' "${KEY_ALIAS:-upload}" | tr -d '[:space:]')
          KPASS=$(printf '%s' "${KEY_PASS:-$KEYSTORE_PASS}" | tr -d '[:space:]')

          if ! printf '%s' "$B64" | base64 -d > android/app/upload-keystore.p12 2>/dev/null; then
            echo "::error::KEYSTORE_B64 base64 olarak çözülemedi — değer eksik/bozuk kopyalanmış."
            exit 1
          fi

          SIZE=$(stat -c%s android/app/upload-keystore.p12)
          SHA=$(sha256sum android/app/upload-keystore.p12 | cut -d' ' -f1)
          echo "p12 boyutu: $SIZE bayt · base64 uzunluğu: ${#B64} karakter · sha256: $SHA"
          echo "::notice::Keystore çözüldü: $SIZE bayt, base64 ${#B64} karakter, sha256 ${SHA:0:16}…"

          if [ "$SIZE" != "${EXPECTED_KEYSTORE_BYTES:-4384}" ]; then
            echo "::error::Anahtar boyutu beklenen ${EXPECTED_KEYSTORE_BYTES:-4384} bayt değil ($SIZE) — KEYSTORE_B64 eksik/fazla kopyalanmış."
            exit 1
          fi
          if [ -n "${EXPECTED_KEYSTORE_SHA256:-}" ] && [ "$SHA" != "$EXPECTED_KEYSTORE_SHA256" ]; then
            echo "::error::Anahtar sha256 beklenen değerle uyuşmuyor — KEYSTORE_B64 başka bir dosyaya ait."
            exit 1
          fi

          {
            echo "storeFile=upload-keystore.p12"
            echo "storePassword=$PASS"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KPASS"
          } > android/key.properties

          # Anahtarı aç: parola ve alias'ı burada doğrula ki hata sessizce
          # debug imzaya düşmesin. keytool çıktısı İngilizce olsun.
          if ! KT=$(keytool -J-Duser.language=en -list -v \
              -keystore android/app/upload-keystore.p12 -storetype PKCS12 \
              -alias "$ALIAS" -storepass "$PASS" 2>&1); then
            echo "$KT" | tail -6
            case "$KT" in
              *"password was incorrect"*|*"tampered"*|*"password"*)
                echo "::error::Keystore parolası hatalı — KEYSTORE_PASS secret'ını kontrol edin." ;;
              *"does not exist"*|*Alias*)
                echo "::error::Alias bulunamadı: '$ALIAS' — KEY_ALIAS secret'ını kontrol edin." ;;
              *)
                echo "::error::Upload anahtarı açılamadı — KEYSTORE_PASS / KEY_ALIAS secret'larını kontrol edin." ;;
            esac
            exit 1
          fi
          echo "$KT" | grep -E "SHA1:|SHA256:" || true
          echo "::notice::Upload imza anahtarı doğrulandı (alias: $ALIAS)."

      # Not: log dosyalari herkese acik olmayabilir; Gradle hatasi hem annotation
      # hem de kosu ozetine yazilir ki sebep tek bakista gorunsun.
      - name: Release APK
        run: |
          set -o pipefail
          if flutter build apk --release --no-pub 2>&1 | tee /tmp/release-apk.log; then
            exit 0
          fi
          echo "### ❌ Release APK derlenemedi" >> $GITHUB_STEP_SUMMARY
          sed -n '/What went wrong/,/^\* Try:/p' /tmp/release-apk.log | head -12 \
            | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error title=Gradle::${line}"
              done
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          sed -n '/What went wrong/,/^\* Try:/p' /tmp/release-apk.log | head -12 \
            >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Debug APK (emülatör/eski cihazlar için)
        run: flutter build apk --debug --no-pub

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: sohbet-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # always(): derleme düşse bile özet/teşhis yazılsın.
      - name: İmza doğrulama (apksigner) + özet
        if: always()
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "### ⚠️ Release APK üretilmedi" >> $GITHUB_STEP_SUMMARY
            echo "Önceki adımların annotation'larına bakın (imza anahtarı veya Gradle)." \
              >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "### APK hazır" >> $GITHUB_STEP_SUMMARY
          echo "Artifact: **sohbet-apk**" >> $GITHUB_STEP_SUMMARY
          APK_SIZE=$(du -h "$APK" | cut -f1)
          APK_SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "- \`app-release.apk\`: **$APK_SIZE**" >> $GITHUB_STEP_SUMMARY
          echo "- apk sha256: \`$APK_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "- commit: \`$GITHUB_SHA\` · run: [#$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | tee apk-certs.txt
          # İmza bilgisini annotation olarak da yayınla (log erişimi olmadan görünür).
          SIGNER_INFO=$(grep -E "certificate (DN|SHA-1) digest" apk-certs.txt \
            | tr '\n' ' ' | sed 's/  */ /g')
          echo "::notice title=APK imzası (app-release.apk)::${SIGNER_INFO}"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep -E "certificate (DN|SHA-1|SHA-256) digest" apk-certs.txt \
            >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          # Firebase'e kayitli iki parmak izi: release (upload) ve debug.
          EXPECTED_LOWER=$(echo "$EXPECTED_UPLOAD_SHA1" | tr 'A-Z' 'a-z' | tr -d ':')
          if grep -qi "$EXPECTED_LOWER" apk-certs.txt; then
            echo "> ✅ **Upload (release) anahtarı** ile imzalı — Firebase'de kayıtlı SHA-1." \
              >> $GITHUB_STEP_SUMMARY
            echo "> Beklenen: \`$EXPECTED_UPLOAD_SHA1\`" >> $GITHUB_STEP_SUMMARY
            echo "> Play Store'a yüklenebilir imza budur." >> $GITHUB_STEP_SUMMARY
          elif grep -qi "CA:D5:F0:42:CD:90:19:D7:61:E9:90:66:40:8A:D6:21:1C:A9:4C:4A" apk-certs.txt; then
            echo "> ✅ Debug anahtarı ile imzalı (Firebase'de kayıtlı debug SHA-1)." \
              >> $GITHUB_STEP_SUMMARY
            echo "> Play Store için KEYSTORE_* secret'larını tanımlayıp yeniden derleyin." \
              >> $GITHUB_STEP_SUMMARY
          else
            echo "> ⚠️ APK upload anahtarıyla imzalanmadı (debug keystore)." \
              >> $GITHUB_STEP_SUMMARY
            echo "> Google girişi için yukarıdaki SHA-1'i Firebase konsolunda Android" \
              >> $GITHUB_STEP_SUMMARY
            echo "> uygulamasına ek fingerprint olarak ekleyin ya da KEYSTORE_* secret'larını tanımlayın." \
              >> $GITHUB_STEP_SUMMARY
          fi
