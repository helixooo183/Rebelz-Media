name: APK derle

# Bu workflow, APK'yı GitHub'ın makinelerinde üretir (yerel Android SDK
# kurulumu gerekmez). Actions sekmesinden "Run workflow" ile çalıştırın,
# bitince APK'yı artifact olarak indirin.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.35.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Analiz + testler
        run: |
          flutter analyze
          flutter test

      - name: Release APK
        run: flutter build apk --release

      - name: Debug APK (emülatör/eski cihazlar için)
        run: flutter build apk --debug

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: sohbet-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: İmza parmak izi (SHA-1/SHA-256)
        run: |
          echo "### APK hazır" >> $GITHUB_STEP_SUMMARY
          echo "Artifact: **sohbet-apk**" >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -storepass android 2>/dev/null \
            | grep -E "SHA1:|SHA256:" >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> CI'da üretilen APK, CI makinesinin debug keystore'u ile imzalanır." >> $GITHUB_STEP_SUMMARY
          echo "> Google girişi için çıkan SHA-1'i Firebase konsolunda Android" >> $GITHUB_STEP_SUMMARY
          echo "> uygulamasına ek fingerprint olarak ekleyin." >> $GITHUB_STEP_SUMMARY
