name: APK derle

# Bu workflow, APK'yı GitHub'ın makinelerinde üretir (yerel Android SDK
# kurulumu gerekmez). Actions sekmesinden "Run workflow" ile çalıştırın,
# bitince APK'yı artifact olarak indirin.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.35.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      # Gradle bağımlılıkları ve wrapper dağıtımı ikinci koşuda yeniden
      # indirilmesin (ilk koşuda birkaç dakika kazandırır).
      - name: Gradle önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Ortam bilgisi
        run: |
          free -m
          nproc
          java -version

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Analiz + testler
        run: |
          flutter analyze
          flutter test

      # GitHub -> Settings -> Secrets and variables -> Actions altinda
      # KEYSTORE_B64 (base64'lenmis .p12), KEYSTORE_PASS, KEY_ALIAS, KEY_PASS
      # tanimliysa upload anahtari acilir ve release APK onunla imzalanir.
      # Tanimli degilse build.gradle.kts debug anahtarina duser.
      - name: Release imza anahtarını aç (secret varsa)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::KEYSTORE_B64 tanımlı değil — release APK debug keystore ile imzalanacak."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.p12
          {
            echo "storeFile=upload-keystore.p12"
            echo "storePassword=$KEYSTORE_PASS"
            echo "keyAlias=${KEY_ALIAS:-upload}"
            echo "keyPassword=${KEY_PASS:-$KEYSTORE_PASS}"
          } > android/key.properties
          echo "::notice::Upload imza anahtarı hazır (alias: ${KEY_ALIAS:-upload})."
          keytool -list -v -keystore android/app/upload-keystore.p12 \
            -storetype PKCS12 -alias "${KEY_ALIAS:-upload}" -storepass "$KEYSTORE_PASS" \
            | grep -E "SHA1:|SHA256:" || true
          # Yanlış secret (parola/alias) sessizce debug imzaya düşmesin: burada patlat.
          if ! keytool -list -keystore android/app/upload-keystore.p12 \
              -storetype PKCS12 -alias "${KEY_ALIAS:-upload}" \
              -storepass "$KEYSTORE_PASS" > /dev/null 2>&1; then
            echo "::error::Upload anahtarı açılamadı — KEYSTORE_PASS / KEY_ALIAS secret'larını kontrol edin."
            exit 1
          fi

      - name: Release APK
        run: flutter build apk --release --no-pub

      - name: Debug APK (emülatör/eski cihazlar için)
        run: flutter build apk --debug --no-pub

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: sohbet-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: İmza doğrulama (apksigner) + özet
        run: |
          echo "### APK hazır" >> $GITHUB_STEP_SUMMARY
          echo "Artifact: **sohbet-apk**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | tee apk-certs.txt
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep -E "certificate (DN|SHA-1|SHA-256) digest" apk-certs.txt \
            >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          # Firebase'e kayitli iki parmak izi: release (upload) ve debug.
          if grep -qi "92:A0:55:FE:C3:85:15:49:CC:45:8D:60:F1:E9:C4:B1:F4:D7:CC:3D" apk-certs.txt; then
            echo "> ✅ **Upload (release) anahtarı** ile imzalı — Firebase'de kayıtlı SHA-1." \
              >> $GITHUB_STEP_SUMMARY
            echo "> Play Store'a yüklenebilir imza budur." >> $GITHUB_STEP_SUMMARY
          elif grep -qi "CA:D5:F0:42:CD:90:19:D7:61:E9:90:66:40:8A:D6:21:1C:A9:4C:4A" apk-certs.txt; then
            echo "> ✅ Debug anahtarı ile imzalı (Firebase'de kayıtlı debug SHA-1)." \
              >> $GITHUB_STEP_SUMMARY
            echo "> Play Store için KEYSTORE_* secret'larını tanımlayıp yeniden derleyin." \
              >> $GITHUB_STEP_SUMMARY
          else
            echo "> ⚠️ APK upload anahtarıyla imzalanmadı (debug keystore)." \
              >> $GITHUB_STEP_SUMMARY
            echo "> Google girişi için yukarıdaki SHA-1'i Firebase konsolunda Android" \
              >> $GITHUB_STEP_SUMMARY
            echo "> uygulamasına ek fingerprint olarak ekleyin ya da KEYSTORE_* secret'larını tanımlayın." \
              >> $GITHUB_STEP_SUMMARY
          fi
