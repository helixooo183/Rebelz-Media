# Bu ortam 2 GB RAM'li. Gradle varsayılanı (-Xmx8G, ayrı Kotlin daemon) OOM'a
# düşürdüğü için değerler bilinçli olarak küçültüldü ve daemon kapatıldı.
org.gradle.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=false
# Kotlin derleyicisini ayrı JVM yerine Gradle içinde çalıştır (≈400 MB tasarruf).
kotlin.compiler.execution.strategy=in-process
