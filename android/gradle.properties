# Gradle bellek ayarları.
#
# Varsayılanlar CI (GitHub Actions, ~7 GB RAM) için seçildi: 2 GB heap,
# Gradle daemon kapalı (tek seferlik derleme), Kotlin derleyicisi ayrı JVM
# açmadan Gradle içinde çalışır.
#
# Çok düşük bellekli bir makinede (≤2 GB RAM) derlerken ilk satırı
#   org.gradle.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m
#   org.gradle.workers.max=1
# ile değiştirin; aksi hâlde Gradle/OOM killer java'yı öldürebilir (exit 137).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m
org.gradle.daemon=false
android.useAndroidX=true
android.enableJetifier=false
kotlin.compiler.execution.strategy=in-process
